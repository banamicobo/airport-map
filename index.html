      position: absolute;
      top: 24px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(10, 10, 20, 0.85);

    }

      color: #aaaacc;

      letter-spacing: 0.05em;
    }

      display: flex;
      gap: 40px;
      justify-content: center;
    }
    #distance-panel .dist-block { text-align: center; }
    #distance-panel .dist-value {
      font-size: 26px;
      font-weight: 600;
      color: #c8a96e;
      letter-spacing: -0.02em;
    }
    #distance-panel .dist-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666688;
      margin-top: 2px;
    }
    #distance-panel .dist-value.ulr { color: #7ab8f5; }
    #distance-panel .dist-value.stop { color: #e0e0e0; }
    #route-status {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 12px;
      line-height: 1.55;
      color: #aaaacc;

    #route-status .verdict.ulr { color: #7ab8f5; }
    #route-status .verdict.stop { color: #ff8a80; }

    #route-status .hub-btn:hover { border-color: #aaaacc; }

      flex-shrink: 0;
    }
    #legend .line-sample.ulr { border-top-color: #7ab8f5; }
    #legend .line-sample.stop { border-top-style: dotted; border-top-color: #777; }

      bottom: 32px; right: 24px;

      background: rgba(10,10,20,0.85);
      backdrop-filter: blur(8px);

      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    #legend .dot-small {

      border: 1.5px solid #7ab8f5;

// ── Zasięg A380 i realne trasy ────────────────────────────────────────────
// Stan wiedzy: RANGE_DATA_DATE. Zasięgi i lista lotów ULR się zmieniają (Project
// Sunrise, nowe warianty) — przegląd w newsach co kwartał, wiersz APM na tablicy.
const RANGE_DATA_DATE = '2026-09-14';
const A380_RANGE_KM = 14200;  // praktyczny: najdłuższa realna trasa A380 (DXB–AKL); katalogowo 14 800 km (8 000 NM)
const ULR_MAX_KM    = 15400;  // najdłuższy lot świata: SIN–JFK 15 349 km, A350-900ULR
const SRC_LONGEST   = 'https://en.wikipedia.org/wiki/Longest_flights';
const SRC_A380      = 'https://simpleflying.com/how-far-can-the-airbus-a380-fly/';
// Ortodroma między odległymi parami (JFK–SIN, BKK–YYZ) przechodzi 87–89°N — na Mercatorze
// to pionowy „pocisk" w górną krawędź mapy. Rysujemy trasę złożoną (composite great circle,
// jak w nawigacji z szerokością graniczną): ortodroma do styczności z równoleżnikiem LAT_CAP,
// odcinek wzdłuż równoleżnika, ortodroma w dół. Dłuższa od czystej ortodromy o ułamek procenta,

function updateMinZoom() {
  const mapHeight = map.getSize().y;
  const topPx = map.project([85, 0], 0).y;
  const botPx = map.project([-85, 0], 0).y;
  const worldHeightAtZ0 = botPx - topPx;
  const minZ = Math.log2(mapHeight / worldHeightAtZ0);
  map.setMinZoom(minZ);
  if (map.getZoom() < minZ) map.setZoom(minZ, { animate: false });
}

// Haversine distance in km
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Great circle intermediate points
function greatCirclePoints(lat1, lon1, lat2, lon2, n=120) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const φ1 = toRad(lat1), λ1 = toRad(lon1);
  const φ2 = toRad(lat2), λ2 = toRad(lon2);

  const d = 2 * Math.asin(Math.sqrt(
    Math.sin((φ2-φ1)/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin((λ2-λ1)/2)**2
  ));

  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    const A = Math.sin((1-f)*d) / Math.sin(d);
    const B = Math.sin(f*d) / Math.sin(d);
    const x = A*Math.cos(φ1)*Math.cos(λ1) + B*Math.cos(φ2)*Math.cos(λ2);
    const y = A*Math.cos(φ1)*Math.sin(λ1) + B*Math.cos(φ2)*Math.sin(λ2);
    const z = A*Math.sin(φ1) + B*Math.sin(φ2);
    let lng = toDeg(Math.atan2(y, x));
    // Odwijanie długości: atan2 zwraca -180..180, więc łuk przez antymerydian
    // skakałby o ~360°. Trzymamy ciągłość względem poprzedniego punktu.
    if (pts.length) {
      const prev = pts[pts.length - 1][1];
      while (lng - prev > 180) lng -= 360;
      while (lng - prev < -180) lng += 360;
    }
    pts.push([toDeg(Math.atan2(z, Math.sqrt(x*x+y*y))), lng]);
  }
  return pts;
}

// Trasa złożona z szerokością graniczną. Zwraca null, gdy ortodroma nie przekracza LAT_CAP
// albo geometria nie pozwala (lotnisko powyżej granicy). Wynik: { pts, km, peak }.
function compositeRoute(lat1, lon1, lat2, lon2, gcPts) {
  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const peak = Math.max(...gcPts.map(p => Math.abs(p[0])));
  if (peak <= LAT_CAP) return null;
  const sign = gcPts.reduce((m, p) => Math.abs(p[0]) > Math.abs(m) ? p[0] : m, 0) > 0 ? 1 : -1;
  const capLat = sign * LAT_CAP;
  if (Math.abs(lat1) >= LAT_CAP || Math.abs(lat2) >= LAT_CAP) return null;
  // Kierunek podróży po długości (odwinięty jak w gcPts)
  const dir = Math.sign(gcPts[gcPts.length - 1][1] - gcPts[0][1]) || 1;
  // Długość geograficzna wierzchołka ortodromy z A stycznej do równoleżnika capLat:
  // cos(Δλ) = tan(φA) / tan(φL)
  const dl1 = toDeg(Math.acos(Math.tan(toRad(lat1)) / Math.tan(toRad(capLat))));
  const dl2 = toDeg(Math.acos(Math.tan(toRad(lat2)) / Math.tan(toRad(capLat))));
  const v1 = lon1 + dir * dl1;
  const v2Raw = lon2 - dir * dl2;
  // v2 w tym samym „odwinięciu" co v1 i po właściwej stronie
  let v2 = v2Raw;
  while (dir * (v2 - v1) < 0) v2 += dir * 360;
  while (dir * (v2 - v1) > 360) v2 -= dir * 360;
  const span = dir * (v2 - v1);
  if (!(span > 0) || span > 180) return null;
  const leg1 = greatCirclePoints(lat1, lon1, capLat, v1, 50);
  const leg3 = greatCirclePoints(capLat, v2, lat2, lon2, 50);
  const along = [];
  const n = Math.max(2, Math.round(span / 2));
  for (let i = 1; i < n; i++) along.push([capLat, v1 + dir * span * i / n]);
  // Sklejenie z zachowaniem ciągłości długości (każdy segment ma własne odwinięcie)
  const glue = (acc, seg) => {
    let off = 0;
    if (acc.length) {
      const prev = acc[acc.length - 1][1], first = seg[0][1];
      off = Math.round((prev - first) / 360) * 360;
    }
    seg.forEach(([la, lo], i) => { if (!(acc.length && i === 0)) acc.push([la, lo + off]); });
    return acc;
  };
  let pts = [];
  pts = glue(pts, leg1); pts = glue(pts, [[capLat, v1], ...along, [capLat, v2]]); pts = glue(pts, leg3);
  let km = 0;
  for (let i = 1; i < pts.length; i++) km += haversine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]);
  return { pts, km, peak };
}

// Trasa do narysowania między dwoma punktami: ortodroma albo trasa złożona, gdy ortodroma
// wchodzi powyżej LAT_CAP. Zwraca { pts, km, capped, peak }.
function routePoints(lat1, lon1, lat2, lon2) {
  const gc = greatCirclePoints(lat1, lon1, lat2, lon2);
  const direct = haversine(lat1, lon1, lat2, lon2);
  const comp = compositeRoute(lat1, lon1, lat2, lon2, gc);
  if (!comp) return { pts: gc, km: direct, capped: false, peak: Math.max(...gc.map(p => Math.abs(p[0]))) };
  return { pts: comp.pts, km: comp.km, capped: true, peak: comp.peak, direct };
}

// Ta sama trasa przesunięta o pełny obrót świata (kopie mapy po lewej/prawej)
function shiftPts(pts, dLng) {
  return pts.map(([lat, lng]) => [lat, lng + dLng]);
}

// Weryfikacja narysowanej trasy: suma odcinków łuku musi zgadzać się z dystansem
// ortodromy (do 0.1%), łuk musi zaczynać się i kończyć w obu lotniskach, a sąsiednie
// punkty nie mogą skakać o setki stopni długości (błąd odwijania przez antymerydian).
// Niezgodność ląduje w konsoli — samolot pasażerski leci po ortodromie, więc łuk
// z innym dystansem to błąd rysowania, nie inna trasa.
function verifyArc(pts, a, b, expectedKm) {
  const norm = lng => ((lng + 180) % 360 + 360) % 360 - 180;
  let len = 0, maxJump = 0;
  for (let i = 1; i < pts.length; i++) {
    len += haversine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]);
    maxJump = Math.max(maxJump, Math.abs(pts[i][1] - pts[i-1][1]));
  }
  const direct = expectedKm || haversine(a.lat, a.lng, b.lat, b.lng);
  const first = pts[0], last = pts[pts.length - 1];
  const problems = [];
  if (expectedKm && expectedKm < haversine(a.lat, a.lng, b.lat, b.lng) * 0.999) problems.push('trasa krótsza od ortodromy');
  if (Math.abs(len - direct) / direct > 0.001) problems.push(`długość łuku ${len.toFixed(1)} km ≠ oczekiwana ${direct.toFixed(1)} km`);
  if (Math.abs(first[0] - a.lat) > 1e-6 || Math.abs(norm(first[1]) - norm(a.lng)) > 1e-6) problems.push(`początek łuku nie leży w ${a.iata}`);
  if (Math.abs(last[0] - b.lat) > 1e-6 || Math.abs(norm(last[1]) - norm(b.lng)) > 1e-6) problems.push(`koniec łuku nie leży w ${b.iata}`);
  if (maxJump > 180) problems.push(`skok długości ${maxJump.toFixed(1)}° między sąsiednimi punktami`);
  if (problems.length) console.error(`Trasa ${a.iata}–${b.iata} nie przeszła weryfikacji:`, problems);
  return problems.length === 0;
}

// Trzy kopie świata dla dowolnej polilinii (lot przez antymerydian widoczny z obu stron 180°)
function arcCopies(pts, style) {
  return [L.polyline(shiftPts(pts, -360), style), L.polyline(pts, style), L.polyline(shiftPts(pts, 360), style)];
}

// Klasyfikacja trasy: 'a380' (w zasięgu), 'ulr' (nonstop tylko maszyną ULR), 'stop' (nikt nie lata nonstop)
function classifyRoute(dist, ulr) {
  if (dist <= A380_RANGE_KM) return 'a380';
  if (dist <= ULR_MAX_KM || ulr) return 'ulr';
  return 'stop';
}

// Huby, przez które da się polecieć w dwóch odcinkach, oba w zasięgu A380; posortowane po sumie
function hubOptions(a, b) {
  const byIata = Object.fromEntries(airports.map(x => [x.iata, x]));
  const candidates = HUBS.filter(h => h !== a.iata && h !== b.iata && byIata[h]);
  const opts = candidates.map(h => {
    const H = byIata[h];
    const l1 = haversine(a.lat, a.lng, H.lat, H.lng);
    const l2 = haversine(H.lat, H.lng, b.lat, b.lng);
    return { hub: H, l1, l2, total: l1 + l2 };
  }).filter(o => o.l1 <= A380_RANGE_KM && o.l2 <= A380_RANGE_KM);
  opts.sort((x, y) => x.total - y.total);
  return opts;
}

const km = n => Math.round(n).toLocaleString('en-US') + ' km';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function updateArc() {
  if (arcLayer) { map.removeLayer(arcLayer); arcLayer = null; }
  const panel = document.getElementById('distance-panel');
  panel.style.display = 'none';
  if (selected.length !== 2) return;

  const [a, b] = selected.map(iata => airports.find(x => x.iata === iata));
  const route = routePoints(a.lat, a.lng, b.lat, b.lng);
  const pts = route.pts;
  verifyArc(pts, a, b, route.km);

  const dist = haversine(a.lat, a.lng, b.lat, b.lng);
  const ulr = findRoute(ulrRoutes, a.iata, b.iata);
  const planned = findRoute(plannedRoutes, a.iata, b.iata);
  const tier = classifyRoute(dist, ulr);

  const gold = { color: '#c8a96e', weight: 2, opacity: 0.85, dashArray: '6 4' };
  const blue = { color: '#7ab8f5', weight: 2, opacity: 0.85, dashArray: '6 4' };
  const grey = { color: '#9a9ab0', weight: 1.5, opacity: 0.55, dashArray: '3 6', interactive: false };

  const status = [];
  let secondValue = km(dist * 1.055), secondLabel = 'Avg. Flight Path', secondClass = '';
  let layers = [];
  const cappedNote = r => r.capped
    ? `<div class="muted">Great circle would peak at ${r.peak.toFixed(1)}°; drawn path stays below ${LAT_CAP}° (polar-ops corridor), +${km(r.km - r.direct)}</div>`
    : '';

  if (tier === 'a380') {
    layers = arcCopies(pts, gold);
    status.push(`<div class="verdict a380">A380 nonstop — within range</div>`);
    if (ulr) status.push(`<div class="line">Flown by ${esc(ulr.airline)} · ${esc(ulr.aircraft)}${ulr.note ? ' · ' + esc(ulr.note) : ''}</div>`);
    status.push(cappedNote(route));
  } else if (tier === 'ulr') {
    layers = arcCopies(pts, blue);
    secondClass = 'ulr';
    status.push(`<div class="verdict ulr">Beyond A380 range — nonstop only with ULR jets</div>`);
    if (ulr) status.push(`<div class="line">Flown by ${esc(ulr.airline)} · ${esc(ulr.aircraft)}${ulr.note ? ' · ' + esc(ulr.note) : ''}</div>`);
    else status.push(`<div class="line">A350-900ULR / 787-9 / 777-200LR territory; no scheduled nonstop known on this pair</div>`);
    status.push(cappedNote(route));
  } else {
    // Nikt nie lata nonstop: ortodroma zostaje jako szare odniesienie, na wierzchu trasa przez hub
    layers = arcCopies(pts, grey);
    secondClass = 'stop';
    const opts = hubOptions(a, b);
    const via = findRoute(viaRoutes, a.iata, b.iata);
    // Kolejność: hub wybrany ręcznie → hub z realnej trasy (viaRoutes) → najkrótsza suma
    const defaultHub = via ? via.via.find(h => opts.some(o => o.hub.iata === h)) : null;
    const pick = opts.find(o => o.hub.iata === (chosenHub || defaultHub)) || opts[0];
    status.push(`<div class="verdict stop">No nonstop flight exists — beyond every airliner in service</div>`);
    if (via) status.push(`<div class="line">Flown as: ${esc(via.flown)} · <a href="${via.src}" target="_blank" rel="noopener">source</a></div>`);
    if (pick) {
      const H = pick.hub;
      const r1 = routePoints(a.lat, a.lng, H.lat, H.lng);
      const r2 = routePoints(H.lat, H.lng, b.lat, b.lng);
      verifyArc(r1.pts, a, H, r1.km); verifyArc(r2.pts, H, b, r2.km);
      layers = layers.concat(arcCopies(r1.pts, gold), arcCopies(r2.pts, gold));
      // Pierścień na hubie — w trzech kopiach świata, jak markery
      [-360, 0, 360].forEach(d => layers.push(L.circleMarker([H.lat, H.lng + d], {
        radius: 19, color: '#f0d090', weight: 2, fill: false, opacity: 0.9, interactive: false,
      })));
      secondValue = km(pick.total); secondLabel = `Via ${H.iata}`;
      status.push(`<div class="line">${a.iata} → <b>${H.iata}</b> → ${b.iata}: ${km(pick.l1)} + ${km(pick.l2)} = ${km(pick.total)} <span class="muted">(+${km(pick.total - dist)} vs great circle)</span></div>`);
      const btns = opts.slice(0, 4).map(o =>
        `<button class="hub-btn${o.hub.iata === H.iata ? ' active' : ''}" data-hub="${o.hub.iata}">via ${o.hub.iata} · ${km(o.total)}</button>`).join('');
      status.push(`<div class="line">${btns}</div>`);
    } else {
      status.push(`<div class="line">No two-leg routing through an A380 hub with both legs within A380 range.</div>`);
    }
  }

  if (planned) {
    status.push(`<div class="line">Nonstop planned: ${esc(planned.airline)} ${esc(planned.aircraft)} (${esc(planned.label)}), ${esc(planned.when)} · <a href="${planned.src}" target="_blank" rel="noopener">source</a></div>`);
  }
  status.push(`<div class="muted">A380 range ${km(A380_RANGE_KM)} (longest route in service) · data as of ${RANGE_DATA_DATE} · <a href="${SRC_LONGEST}" target="_blank" rel="noopener">longest flights</a> · <a href="${SRC_A380}" target="_blank" rel="noopener">A380 range</a></div>`);

  arcLayer = L.layerGroup(layers).addTo(map);

  document.getElementById('airports-label').textContent = `${a.iata} ↔ ${b.iata}`;
  document.getElementById('dist-straight').textContent = km(dist);
  const second = document.getElementById('dist-flight');
  second.textContent = secondValue;
  second.className = 'dist-value ' + secondClass;
  document.getElementById('dist-flight-label').textContent = secondLabel;
  const st = document.getElementById('route-status');
  st.innerHTML = status.join('');
  st.querySelectorAll('.hub-btn').forEach(btn => btn.addEventListener('click', e => {
    L.DomEvent.stopPropagation(e);
    chosenHub = btn.dataset.hub;
    updateArc();
  }));
  panel.style.display = 'block';
}

function updateHint() {
  const el = document.getElementById('hint-text');
  if (selected.length === 0) el.textContent = 'Click an airport to select · Scroll to zoom';
  else if (selected.length === 1) el.textContent = `${selected[0]} selected — click a second airport or click map to deselect`;
  else el.textContent = `${selected[0]} ↔ ${selected[1]} — click map to clear`;
}

function refreshMarkers() {
  airports.forEach(a => {
    const isSel = selected.includes(a.iata);
    markerRefs[a.iata].forEach(m => m.setStyle(makeStyle(a, isSel)));
  });
}

// Create markers — każde lotnisko w trzech kopiach świata (-360°, 0°, +360°),
// żeby kropka nie znikała, gdy mapa jest przewinięta poza pierwszą kopię
// (np. Hawaje oglądane od strony Pacyfiku/Azji).
airports.forEach(a => {
  markerRefs[a.iata] = [-360, 0, 360].map(dLng => {
    const m = L.circleMarker([a.lat, a.lng + dLng], makeStyle(a, false))
      .addTo(map)
      .bindTooltip(tooltipHtml(a), { sticky: false, interactive: true, className: '', direction: 'auto', offset: [12, 0] });

    m.on('click', e => {
      L.DomEvent.stopPropagation(e);
      if (selected.includes(a.iata)) {
        selected = selected.filter(x => x !== a.iata);
      } else if (selected.length < 2) {
        selected.push(a.iata);
      } else {
        selected = [a.iata];
      }
      chosenHub = null;
      refreshMarkers();
      updateArc();
      updateHint();
    });
    return m;
  });
});

// Click on map = clear selection
map.on('click', () => {
  selected = [];
  chosenHub = null;
  refreshMarkers();
  updateArc();
  updateHint();
});
</script>
</body>
</html>
